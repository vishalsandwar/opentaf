[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opentaf"
version = "0.1.0"
description = "Open Transformation & Agentic AI Framework"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Vishal Sandwar"}
]

[tool.setuptools.packages.find]
where = ["src"]
